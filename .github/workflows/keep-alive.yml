name: Keep Alive

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs during periods of
    # low repo activity — see the README's "Keep-alive workflow" note.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --fail --show-error --silent \
            --max-time 90 --retry 2 --retry-delay 5 \
            "${{ vars.BACKEND_HEALTH_URL }}"
