name: Keep Alive

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs during periods of
    # low repo activity — see the README's "Keep-alive workflow" note.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          # Render's free tier can take a few minutes to wake, so retry for
          # up to ~5 minutes and log each status/body so failures are diagnosable.
          for i in $(seq 1 15); do
            code=$(curl --silent --max-time 30 --output /tmp/body.txt \
              --write-out "%{http_code}" "${{ vars.BACKEND_HEALTH_URL }}" || true)
            echo "attempt $i: HTTP $code"
            head -c 500 /tmp/body.txt; echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          exit 1
